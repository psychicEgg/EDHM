[Include]
; You can press F11 to reload your changes (F11 keybind can be edited in Dev.ini)
include_recursive = EDHM-ini/3rdPartyMods
include = EDHM-ini/SuitHud.ini
include = EDHM-ini/35aac.ini
include = EDHM-ini/Startup-Profile.ini
include = EDHM-ini/XML-Profile.ini
include = EDHM-ini/Advanced.ini
include = EDHM-ini/DevMode/Dev.ini

[Constants]
; Alternative condition for detecting the New Squadron Menu --- USE WITH CAUTION ---
;------------------------------------------------------------------------------------------------------
; The current detection method requires modding each resolution individually (including each supersampling level),
; which isn't ideal, and I can't handle resolutions higher than 1920x1080.
; Therefore, with standard detection, the Squadron Menu might display incorrect colors at resolutions above 1920x1080.
;
; This alternative detection method forces the correct coloring of the Squadron Menu for resolutions higher than 1920x1080,
; but it can interfere with other elements (some elements may flicker for a few seconds when they appear,
; others might appear in a wrong color).
;
; This is a workaround I hope is temporary, but for now, I haven't found any resources to properly isolate the New Squadron Menu.
;------------------------------------------------------------------------------------------------------
; Set global $UHDSquadronMenuTEST value
; 0 = Original Detection Method
; 1 = Alternative Detection Method --- USE WITH CAUTION ---
;------------------------------------------------------------------------------------------------------
global $UHDSquadronMenuTEST = 0

